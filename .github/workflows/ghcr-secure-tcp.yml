# Builds hbbs/hbbr from this branch (upstream + secure_tcp patch) and pushes the image to GHCR.
# Image: ghcr.io/<owner>/rustdesk-server:<UPSTREAM>-st<PATCH> and :latest (linux/amd64)
name: ghcr-secure-tcp

on:
  workflow_dispatch:
  push:
    branches:
      - secure-tcp

env:
  UPSTREAM: "1.1.15"
  PATCH: "1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rustdesk-server" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerfile
        run: |
          cat > Dockerfile.secure-tcp <<'EOF'
          FROM rust:1-bookworm AS build
          WORKDIR /src
          COPY . .
          RUN cargo build --release --bin hbbs --bin hbbr

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=build /src/target/release/hbbs /usr/bin/hbbs
          COPY --from=build /src/target/release/hbbr /usr/bin/hbbr
          WORKDIR /root
          ENV HOME=/root
          EOF

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.secure-tcp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM }}-st${{ env.PATCH }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=RustDesk Server OSS ${{ env.UPSTREAM }} with secure_tcp key exchange patch
